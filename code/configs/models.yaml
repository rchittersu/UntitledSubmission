# Model registry for scripts/run_model.py (see uhdd/models.py).
# Paths use environment variables so no machine-specific paths are committed:
#   UHDD_REPOS   = folder with cloned third-party repos
#   UHDD_WEIGHTS = folder with checkpoints
#
# Fields: kind (torch|builtin), op (builtin: identity|bicubic), repo,
#   import (pkg.module:Class, or file.py:Class relative to repo -- preferred), kwargs, weights, state_key,
#   strict, multiple (H/W divisibility), scale (output/input), input_range, output_index,
#   clamp, input_bits (quantize inputs, e.g. 8 for models trained on 8-bit data),
#   adapter (module:function for non-standard models).
# [V] = verify against the original repo before trusting numbers.

models:
  identity:            # the blurry input itself (lower bound / sanity check)
    kind: builtin
    op: identity

  bicubic_x4:          # x4 upsampling of a low-res result (G2 baseline)
    kind: builtin
    op: bicubic
    scale: 4

  bicubic_x2:
    kind: builtin
    op: bicubic
    scale: 2

  restormer_dpdd:      # Restormer, single-image defocus deblurring (DPDD), CVPR 2022
    repo: ${UHDD_REPOS}/Restormer
    import: basicsr/models/archs/restormer_arch.py:Restormer   # file import: skips basicsr/__init__
    kwargs:
      inp_channels: 3
      out_channels: 3
      dim: 48
      num_blocks: [4, 6, 6, 8]
      num_refinement_blocks: 4
      heads: [1, 2, 4, 8]
      ffn_expansion_factor: 2.66
      bias: false
      LayerNorm_type: WithBias
      dual_pixel_task: false
    weights: ${UHDD_WEIGHTS}/restormer/single_image_defocus_deblurring.pth
    state_key: params
    multiple: 8        # 3 downsamplings
    input_bits: 8      # trained and tested on 8-bit DPDD (DefocusDeblur_Single_8bit_Restormer.yml)
    # Weights: https://github.com/swz30/Restormer/releases (single_image_defocus_deblurring.pth).
    # Official test: whole 1680x1120 image, 8-bit input and target, no padding needed.
    # VERIFIED (2026-10-01, CPU): whole-image run on the repo's demo/degraded images reproduces
    # demo/restored/Single_Image_Defocus_Deblurring bit-exactly up to <=21 pixels off by 1/255.
    # Published DPDD single-image (combined): PSNR 25.98, SSIM 0.811, MAE 0.038, LPIPS 0.178 [V]

  bokehlicious_deblur: # Bokehlicious, RealDefocus defocus-deblurring variant (ICCV 2025 / arXiv 2607.21078)
    repo: ${UHDD_REPOS}/Bokehlicious
    factory: uhdd.adapters.bokehlicious:build
    adapter: uhdd.adapters.bokehlicious:wrap
    size: defocus_deblur
    weights: ${UHDD_WEIGHTS}/bokehlicious/defocus_deblur.pt   # `zpaq x checkpoints/defocus_deblur.zpaq`
    multiple: 4        # U-Net depth 2; transformer windows are padded inside the model
    av: 4.0            # f-number of the blurry input (DPDD: f/4) -> attention range; RealDefocus uses EXIF
    # Trained on RealDefocus (not DPDD) -> cross-dataset baseline on DPDD. Needs `timm`.

  restormer_dpdd_tlc:  # Restormer DPDD + TLC local attention statistics at test time (baseline A4, docs/baselines.md)
    repo: ${UHDD_REPOS}/Restormer
    import: basicsr/models/archs/restormer_arch.py:Restormer
    adapter: uhdd.adapters.tlc:wrap
    tlc_base: 576      # 1.5 x the largest training crop (384), as recommended by TLC
    kwargs: {inp_channels: 3, out_channels: 3, dim: 48, num_blocks: [4, 6, 6, 8], num_refinement_blocks: 4,
             heads: [1, 2, 4, 8], ffn_expansion_factor: 2.66, bias: false, LayerNorm_type: WithBias, dual_pixel_task: false}
    weights: ${UHDD_WEIGHTS}/restormer/single_image_defocus_deblurring.pth
    state_key: params
    multiple: 8
    input_bits: 8

  lakdnet_dpdd_l:      # LaKDNet large, single-view, trained on DPDD (arXiv 2302.02234)
    repo: ${UHDD_REPOS}/LaKDNet
    import: models/LaKDNet.py:LaKDNet
    kwargs: {inp_channels: 3, out_channels: 3, dim: 48, num_blocks: [8, 12, 12, 16], mix_kernel_size: [9, 9, 9, 9]}
    weights: ${UHDD_WEIGHTS}/lakdnet/train_on_dpdd_l.pth   # lakdnet.mpi-inf.mpg.de/Weights/Defocus/train_on_dpdd_l/
    multiple: 8        # official run.py reflect-pads to 8
    input_bits: 8      # official single-view test reads 8-bit
    # README (DPDD): PSNR 26.25, SSIM 0.813

  lakdnet_dpdd_s:      # LaKDNet small
    repo: ${UHDD_REPOS}/LaKDNet
    import: models/LaKDNet.py:LaKDNet
    kwargs: {inp_channels: 3, out_channels: 3, dim: 32, num_blocks: [8, 12, 12, 16], mix_kernel_size: [9, 9, 9, 9]}
    weights: ${UHDD_WEIGHTS}/lakdnet/train_on_dpdd_s.pth
    multiple: 8
    input_bits: 8
    # README (DPDD): PSNR 26.15, SSIM 0.810

  drbnet_single:       # DRBNet single-image (CVPR 2022), trained on LFDOF + DPDD
    repo: ${UHDD_REPOS}/DRBNet
    import: models/DRBNet.py:DRBNet_single
    weights: ${UHDD_WEIGHTS}/drbnet/ckpts/single/single_image_defocus_deblurring.pth  # download_ckpts.py (gdrive)
    multiple: 16       # official test crops to a multiple of 16 (DPDD 1680x1120 unaffected); we pad
    input_bits: 8
    input_range: [-1.0, 1.0]
    # Needs torchvision (imported by the model file).

  ifan:                # IFAN (CVPR 2021), trained on DPDD
    repo: ${UHDD_REPOS}/IFAN
    factory: uhdd.adapters.ifan:build
    adapter: uhdd.adapters.ifan:wrap
    weights: ${UHDD_WEIGHTS}/ifan/IFAN.safetensors   # github.com/jacobsparts/ifan-rs/releases/download/v0.1.0/IFAN.safetensors
    # (bit-identical to official IFAN.pytorch deblurring net; IFAN.pytorch from the official zip also works)
    weights_in_factory: true
    multiple: 8        # official test crops to a multiple of 8; we pad
    input_bits: 8
    # Needs easydict.

  swinir_x4:           # SwinIR-M classical x4 SR (bicubic degradation), regression upsampler for G2
    repo: ${UHDD_REPOS}/SwinIR
    import: models/network_swinir.py:SwinIR
    kwargs: {upscale: 4, in_chans: 3, img_size: 64, window_size: 8, img_range: 1.0, depths: [6, 6, 6, 6, 6, 6],
             embed_dim: 180, num_heads: [6, 6, 6, 6, 6, 6], mlp_ratio: 2, upsampler: pixelshuffle, resi_connection: 1conv}
    weights: ${UHDD_WEIGHTS}/swinir/001_classicalSR_DF2K_s64w8_SwinIR-M_x4.pth   # GitHub releases v0.0
    state_key: params
    scale: 4
    multiple: 8        # window size

  swinir_x4_real:      # SwinIR-M real-world x4 (BSRGAN degradations, GAN), perceptual upsampler for G2
    repo: ${UHDD_REPOS}/SwinIR
    import: models/network_swinir.py:SwinIR
    kwargs: {upscale: 4, in_chans: 3, img_size: 64, window_size: 8, img_range: 1.0, depths: [6, 6, 6, 6, 6, 6],
             embed_dim: 180, num_heads: [6, 6, 6, 6, 6, 6], mlp_ratio: 2, upsampler: nearest+conv, resi_connection: 1conv}
    weights: ${UHDD_WEIGHTS}/swinir/003_realSR_BSRGAN_DFO_s64w8_SwinIR-M_x4_GAN.pth
    state_key: params_ema
    scale: 4
    multiple: 8

  swinir_x2:           # SwinIR-M classical x2 SR (bicubic degradation)
    repo: ${UHDD_REPOS}/SwinIR
    import: models/network_swinir.py:SwinIR
    kwargs: {upscale: 2, in_chans: 3, img_size: 64, window_size: 8, img_range: 1.0, depths: [6, 6, 6, 6, 6, 6],
             embed_dim: 180, num_heads: [6, 6, 6, 6, 6, 6], mlp_ratio: 2, upsampler: pixelshuffle, resi_connection: 1conv}
    weights: ${UHDD_WEIGHTS}/swinir/001_classicalSR_DF2K_s64w8_SwinIR-M_x2.pth
    state_key: params
    scale: 2
    multiple: 8

  swinir_x2_real:      # SwinIR-M real-world x2 (BSRGAN degradations, GAN)
    repo: ${UHDD_REPOS}/SwinIR
    import: models/network_swinir.py:SwinIR
    kwargs: {upscale: 2, in_chans: 3, img_size: 64, window_size: 8, img_range: 1.0, depths: [6, 6, 6, 6, 6, 6],
             embed_dim: 180, num_heads: [6, 6, 6, 6, 6, 6], mlp_ratio: 2, upsampler: nearest+conv, resi_connection: 1conv}
    weights: ${UHDD_WEIGHTS}/swinir/003_realSR_BSRGAN_DFO_s64w8_SwinIR-M_x2_GAN.pth
    state_key: params_ema
    scale: 2
    multiple: 8

  # ---- stronger x4 upsamplers after the 1/4-res deblur (docs/baselines.md, group C) ----
  hat_l_x4:            # HAT-L classical x4 (ImageNet pretrain + DF2K), fidelity upsampler. LR tiles 256, overlap 32
    repo: ${UHDD_REPOS}/HAT
    factory: uhdd.adapters.hat:build
    kwargs: {upscale: 4, in_chans: 3, img_size: 64, window_size: 16, compress_ratio: 3, squeeze_factor: 30,
             conv_scale: 0.01, overlap_ratio: 0.5, img_range: 1.0, depths: [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6],
             embed_dim: 180, num_heads: [6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6, 6], mlp_ratio: 2,
             upsampler: pixelshuffle, resi_connection: 1conv}
    weights: ${UHDD_WEIGHTS}/hat/HAT-L_SRx4_ImageNet-pretrain.pth   # official: Google Drive (HAT README)
    state_key: params_ema
    scale: 4
    multiple: 16

  hat_x4_real:         # Real-HAT-GAN x4 (real-world degradations, GAN), perceptual upsampler
    repo: ${UHDD_REPOS}/HAT
    factory: uhdd.adapters.hat:build
    kwargs: {upscale: 4, in_chans: 3, img_size: 64, window_size: 16, compress_ratio: 3, squeeze_factor: 30,
             conv_scale: 0.01, overlap_ratio: 0.5, img_range: 1.0, depths: [6, 6, 6, 6, 6, 6],
             embed_dim: 180, num_heads: [6, 6, 6, 6, 6, 6], mlp_ratio: 2, upsampler: pixelshuffle, resi_connection: 1conv}
    weights: ${UHDD_WEIGHTS}/hat/Real_HAT_GAN_SRx4.pth
    state_key: params_ema
    scale: 4
    multiple: 16

  osediff_x4:          # OSEDiff one-step diffusion SR (SD2.1-base + LoRA). CUDA only. LR tiles 128 (HR 512), overlap 32
    repo: ${UHDD_REPOS}/OSEDiff
    factory: uhdd.adapters.osediff:build
    adapter: uhdd.adapters.osediff:wrap
    weights_in_factory: true
    weights: ${UHDD_REPOS}/OSEDiff/preset/models/osediff.pkl          # shipped in the repo
    sd_path: ${UHDD_WEIGHTS}/sd21_base                                # HF snapshot of stable-diffusion-2-1-base
    ram_path: ${UHDD_WEIGHTS}/ram/ram_swin_large_14m.pth
    dape_path: ${UHDD_REPOS}/OSEDiff/preset/models/DAPE.pth           # shipped in the repo
    prompt: dape         # dape | empty
    color_fix: adain     # official default
    precision: fp16
    scale: 4
    multiple: 8
