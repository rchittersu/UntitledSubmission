# Crops for the qualitative figures of the paper (Template/fig/qual*.tex, texture.tex): `scripts/make_qual_crops.py`.
# Each row is a native-resolution window (y, x in native px; `size` window, saved at `out_px`) of one test scene; each
# column a method output. Paths are templates ({scene}) under $UHDD_DATA / $UHDD_RESULTS. DRBNet anchor, as the tables:
# legacy layout (handoffs 2-3) for native / bicubic / HAT-L / SwinIR-real / OSEDiff / composite, new layout (handoff 4) for
# S3Diff and VOSR2.
out: ${UHDD_RESULTS}/qual_figure
size: 256
columns:
  target:    ${UHDD_DATA}/dpdd_native_v2/x1/targets/{scene}.png
  input:     ${UHDD_DATA}/dpdd_native_v2/inputs/{scene}.png
  native:    ${UHDD_RESULTS}/dpdd_v2/steps/x1__drbnet_single@t1120o140/{scene}.png
  bicubic:   ${UHDD_RESULTS}/dpdd_v2/steps/x4__drbnet_single@whole__bicubic_x4@whole/{scene}.png
  hatl:      ${UHDD_RESULTS}/dpdd_v2/steps/x4__drbnet_single@whole__hat_l_x4@t512o64/{scene}.png
  swinir:    ${UHDD_RESULTS}/dpdd_v2/steps/x4__drbnet_single@whole__swinir_x4_real@t400o50/{scene}.png
  osediff:   ${UHDD_RESULTS}/dpdd_v2/steps/x4__drbnet_single@whole__osediff_x4@t128o16/{scene}.png
  s3diff:    ${UHDD_RESULTS}/dpdd/upsample/ours_x4/drbnet_single@whole/s3diff_x4@t192o24/{scene}.png
  vosr2:     ${UHDD_RESULTS}/dpdd/upsample/ours_x4/drbnet_single@whole/vosr2_x4@t128o16/{scene}.png
  composite: ${UHDD_RESULTS}/dpdd_v2/baselines_bd/drbnet_single_composite/{scene}.png
rows:
  lockers: {scene: 1P0A2030, y: 1504, x: 3802}
  poster:  {scene: 1P0A1890, y: 544,  x: 552}
  dark:    {scene: 1P0A2202, y: 2536, x: 6208}
  # same texture in focus (b0) and defocused (b2 / b1) in one image: how it evolves with deblur and upsampling
  scriptF: {scene: 1P0A1046, y: 2500, x: 300,  size: 512, out_px: 256}
  scriptD: {scene: 1P0A1046, y: 2900, x: 4300, size: 512, out_px: 256}
  weaveF:  {scene: 1P0A1112, y: 3440, x: 3300, size: 512, out_px: 256}
  weaveD:  {scene: 1P0A1112, y: 2400, x: 3300, size: 512, out_px: 256}
