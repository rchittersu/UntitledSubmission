# Evaluation protocol v3 (docs/evaluation.md): the P1 pipelines + group-C upsamplers, re-scored with the
# blur-stratified perceptual metrics, no-harm, aligned PSNR and the resolution sweep.
# Results dir is separate from dpdd_p1 (the step cache is keyed by pipeline, not by dataset: P1 outputs were
# computed on the v1 renderings and must not be reused for dpdd_native_v2). If an earlier run on
# dpdd_native_v2 went into another results dir, point `results` there to reuse its inference.
# Run: python code/scripts/run_matrix.py code/experiments/dpdd_eval_v3.yaml --gpus all [--dry-run]
# Training-free baselines (group B) and reference-based SR (group D) are scripts, not registry models:
# see code/experiments/run_baselines_bd.sh.

data:
  inputs:  {1: "${UHDD_DATA}/dpdd_native_v2/inputs", 2: "${UHDD_DATA}/dpdd_native_v2/x2/inputs", 4: "${UHDD_DATA}/dpdd_native_v2/x4/inputs"}
  targets: {1: "${UHDD_DATA}/dpdd_native_v2/x1/targets", 2: "${UHDD_DATA}/dpdd_native_v2/x2/targets", 4: "${UHDD_DATA}/dpdd_native_v2/x4/targets"}
  masks:   {1: "${UHDD_DATA}/dpdd_native_v2/x1/masks", 2: "${UHDD_DATA}/dpdd_native_v2/x2/masks", 4: "${UHDD_DATA}/dpdd_native_v2/x4/masks"}
  native_hw: [4480, 6720]

results: "${UHDD_RESULTS}/dpdd_v2"

# Tiling: no global tile -> every step uses its model's paper inference setup (registry paper_input / paper_tile,
# docs/evaluation.md "Tiling"): DPDD deblurrers whole at x4, 1120-px tiles at x2/x1; SwinIR 400, HAT 512,
# OSEDiff 128 LR px; bicubic whole. Overlap = tile / 8 for everyone. Batch: registry tile_batch, else 2 / 4.
run:
  overlap_ratio: 0.125
  blend: linear
  precision: fp32

eval:
  # dpdd4 (2026-10-04): the frozen headline (docs/evaluation.md decision log) + diagnostics. Inference is cached;
  # only evaluation reruns. dpdd3 = same minus musiq/clipiqa/ssim_s*.
  tag: dpdd4
  metrics: psnr,ssim,lpips,dists,musiq,clipiqa,msres,hb,blurbins,percbins,noharm,apsnr,gridshift,pm
  crop_native: 64
  options:
    dp_maps: "${UHDD_DATA}/dpdd_native/dp_maps"
  table_cols: psnr,ssim,lpips,dists,musiq,clipiqa,psnr_s4,ssim_s4,pipeline_time_s,peak_mem_gb

pipelines:
  # Table 1 -- deblur only, at x4 (= standard DPDD resolution), scored at x4
  - group: t1_deblur_x4
    name: "{m} deblur @x4"
    for: {m: [restormer_dpdd, lakdnet_dpdd_l, drbnet_single, ifan, bokehlicious_deblur]}
    steps:
      - {model: "{m}", scale: 4}

  - group: t1_deblur_x4
    name: "input (blurry) @x4"
    steps:
      - {model: identity, scale: 4}

  - group: references
    name: "input (blurry)"
    steps:
      - {model: identity, scale: 1, tile: 0}

  - group: g1_native_patchwise
    name: "{m} native (paper tiling)"
    for: {m: [restormer_dpdd, lakdnet_dpdd_l, drbnet_single, ifan, bokehlicious_deblur]}
    steps:
      - {model: "{m}", scale: 1}

  - group: g1_tile_ablation           # 512 tiles = P1 setting (supplementary: tile size does not matter)
    name: "{m} native t512"
    for: {m: [restormer_dpdd, drbnet_single]}
    steps:
      - {model: "{m}", scale: 1, tile: 512, tile_batch: 2}

  # A. retrained-at-native rows are added here once P2b produces the checkpoints (docs/baselines.md A1-A3)

  - group: a4_tlc
    name: "restormer_dpdd_tlc native (paper tiling)"
    steps:
      - {model: restormer_dpdd_tlc, scale: 1}

  - group: g2_lowres_upsample
    name: "{m} @x4 + {up}"
    for: {m: [restormer_dpdd, drbnet_single], up: [bicubic_x4, swinir_x4_real, hat_l_x4, hat_x4_real]}
    steps:
      - {model: "{m}", scale: 4}
      - {model: "{up}"}

  - group: g2_lowres_upsample_rest     # remaining baselines at x4 (Bokehlicious works at ~3 MP = the x4 regime)
    name: "{m} @x4 + {up}"
    for: {m: [bokehlicious_deblur, lakdnet_dpdd_l, ifan], up: [bicubic_x4, hat_l_x4]}
    steps:
      - {model: "{m}", scale: 4}
      - {model: "{up}", tile_batch: 1}

  - group: g2_lowres_upsample_bokeh_real   # Bokehlicious x4 + Real-HAT (requested for manual inspection)
    name: "{m} @x4 + {up}"
    for: {m: [bokehlicious_deblur], up: [hat_x4_real]}
    steps:
      - {model: "{m}", scale: 4}
      - {model: "{up}", tile_batch: 1}

  - group: g2_lowres_upsample_diffusion
    name: "{m} @x4 + {up}"
    for: {m: [restormer_dpdd, drbnet_single], up: [osediff_x4]}
    steps:
      - {model: "{m}", scale: 4}
      - {model: "{up}", tile_batch: 1}

  - group: g2_x2_upsample
    name: "{m} @x2 + {up}"
    for: {m: [restormer_dpdd, drbnet_single], up: [bicubic_x2, swinir_x2_real]}
    steps:
      - {model: "{m}", scale: 2}
      - {model: "{up}"}
